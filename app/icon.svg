<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">

  <!-- Navy background -->
  <rect width="64" height="64" fill="#1E3A5F"/>

  <!-- Gold bottom bar -->
  <rect x="0" y="58" width="64" height="6" fill="#C9A84C"/>

  <!-- Scales of Justice -->

  <!-- Central pole -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Top gold ornament -->
  <circle cx="32" cy="10" r="4.5" fill="#C9A84C"/>

  <!-- Horizontal beam -->
  <line x1="10" y1="24" x2="54" y2="24" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Center pivot -->
  <circle cx="32" cy="24" r="3.5" fill="white"/>

  <!-- Left arm -->
  <line x1="10" y1="24" x2="10" y2="36" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Left pan -->
  <path d="M5 36 Q10 44 15 36" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Right arm -->
  <line x1="54" y1="24" x2="54" y2="36" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Right pan -->
  <path d="M49 36 Q54 44 59 36" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Base -->
